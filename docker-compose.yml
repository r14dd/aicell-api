# docker compose up --build   ->  API on http://localhost:${WEB_PORT:-8010}
#
# Every service reads its settings from the environment; see .env.example.

x-app: &app
  build: .
  environment: &app-env
    # Always off here, whatever .env says: this stack is the production-like one.
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env (see .env.example)}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8010}
    # Served over plain HTTP on localhost; switch both on behind TLS.
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    SECURE_COOKIES: ${SECURE_COOKIES:-false}
    # One SQLite file on a volume shared by the web, worker and beat containers.
    # Set DATABASE_URL in .env to a postgres:// URL to use PostgreSQL instead.
    DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
    REDIS_URL: redis://redis:6379/0
    DEMO_AUTH: ${DEMO_AUTH:-false}
    # The sign-in code every number accepts until an SMS provider is wired in.
    OTP_TEST_CODE: ${OTP_TEST_CODE:-000000}
    DEMO_ADMIN_LOGIN: ${DEMO_ADMIN_LOGIN:-false}
    GOOGLE_PAY_SIMULATED: ${GOOGLE_PAY_SIMULATED:-true}
    SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-aicell-demo}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
    INSIGHTS_QUIET_HOURS: ${INSIGHTS_QUIET_HOURS:-true}
    # Laya answers with keyword rules until a key is given; then the model is used.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LAYA_PLAN_MODEL: ${LAYA_PLAN_MODEL:-claude-sonnet-5-5}
    LAYA_NARRATE_MODEL: ${LAYA_NARRATE_MODEL:-claude-haiku-5-5}
    THROTTLE_OTP_IP: ${THROTTLE_OTP_IP:-5/min}
    THROTTLE_OTP_PHONE: ${THROTTLE_OTP_PHONE:-5/min}
    THROTTLE_MONEY: ${THROTTLE_MONEY:-30/min}
    THROTTLE_SUBSCRIBER: ${THROTTLE_SUBSCRIBER:-300/min}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # A file (Milvus Lite) by default; http://milvus:19530 with `--profile milvus`.
    MILVUS_URI: ${MILVUS_URI:-/app/data/knowledge.db}
  volumes:
    - data:/app/data
    - media:/app/media

services:
  web:
    <<: *app
    # Schema, static files and the seed are prepared before the server starts.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "${WEB_PORT:-8010}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional Milvus server: docker compose --profile milvus up, MILVUS_URI=http://milvus:19530
  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvus:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports:
      - "127.0.0.1:19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  data:
  media:
  milvus:
