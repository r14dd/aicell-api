<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1190" width="1100" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker></defs>
<rect width="1100" height="1190" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#24292f">aicell-api — one insight, from detection to a tap</text>
<rect x="20" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="80" y="64" text-anchor="middle" fill="#24292f">Subscriber</text>
<line x1="80" y1="74" x2="80" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="200" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="260" y="64" text-anchor="middle" fill="#24292f">Mobile app</text>
<line x1="260" y1="74" x2="260" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="390" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="450" y="64" text-anchor="middle" fill="#24292f">API</text>
<line x1="450" y1="74" x2="450" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="580" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="640" y="64" text-anchor="middle" fill="#24292f">Insight engine</text>
<line x1="640" y1="74" x2="640" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="770" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="830" y="64" text-anchor="middle" fill="#24292f">Laya brain</text>
<line x1="830" y1="74" x2="830" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="950" y="44" width="120" height="30" fill="#fff" stroke="#24292f"/><text x="1010" y="64" text-anchor="middle" fill="#24292f">Billing</text>
<line x1="1010" y1="74" x2="1010" y2="1180" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="10" y="86" width="152" height="22" fill="#fff" stroke="#24292f"/><text x="16" y="101" font-size="11" font-weight="700" fill="#24292f">Insight and delivery</text>
<line x1="260" y1="134" x2="448" y2="134" stroke="#24292f" marker-end="url(#a)"/>
<text x="355.0" y="128" text-anchor="middle" font-size="11" fill="#24292f">1. GET /api/insights/  (Bearer JWT, own subscriber only)</text>
<line x1="450" y1="174" x2="638" y2="174" stroke="#24292f" marker-end="url(#a)"/>
<text x="545.0" y="168" text-anchor="middle" font-size="11" fill="#24292f">2. figures + 8 detectors on 30 days of usage</text>
<line x1="640" y1="214" x2="452" y2="214" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="545.0" y="208" text-anchor="middle" font-size="11" fill="#24292f">insight { evidence, offers[] from live catalogue, task }</text>
<rect x="300" y="242" width="330" height="40" fill="#fff" stroke="#24292f"/>
<text x="308" y="256" font-size="11" fill="#24292f">Delivery rules: urgent always, one informational per 48 h,</text>
<text x="308" y="270" font-size="11" fill="#24292f">quiet 23:00–08:00 Baku, a dismissed kind silent 14 days</text>
<line x1="450" y1="306" x2="262" y2="306" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="355.0" y="300" text-anchor="middle" font-size="11" fill="#24292f">3. insight card</text>
<rect x="10" y="342" width="313" height="22" fill="#fff" stroke="#24292f"/><text x="16" y="357" font-size="11" font-weight="700" fill="#24292f">Laya words it, the backend owns the numbers</text>
<line x1="260" y1="390" x2="448" y2="390" stroke="#24292f" marker-end="url(#a)"/>
<text x="355.0" y="384" text-anchor="middle" font-size="11" fill="#24292f">4. POST /api/laya/narrate/  { insight, language }</text>
<line x1="450" y1="430" x2="828" y2="430" stroke="#24292f" marker-end="url(#a)"/>
<text x="640.0" y="424" text-anchor="middle" font-size="11" fill="#24292f">5. forced single tool call (Claude, or Gemini)</text>
<line x1="830" y1="470" x2="452" y2="470" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="640.0" y="464" text-anchor="middle" font-size="11" fill="#24292f">speech</text>
<rect x="300" y="498" width="330" height="40" fill="#fff" stroke="#24292f"/>
<text x="308" y="512" font-size="11" fill="#24292f">Guard: a number that is not in the request is rejected,</text>
<text x="308" y="526" font-size="11" fill="#24292f">one retry, then 502. A plan falls back to keyword rules.</text>
<line x1="450" y1="562" x2="262" y2="562" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="355.0" y="556" text-anchor="middle" font-size="11" fill="#24292f">6. one spoken sentence</text>
<line x1="260" y1="602" x2="82" y2="602" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="170.0" y="596" text-anchor="middle" font-size="11" fill="#24292f">says it aloud, asks yes / no</text>
<line x1="80" y1="646" x2="258" y2="646" stroke="#24292f" marker-end="url(#a)"/>
<text x="170.0" y="640" text-anchor="middle" font-size="11" fill="#24292f">7. “hə”  /  “niyə?”  /  “balansım”</text>
<line x1="260" y1="686" x2="448" y2="686" stroke="#24292f" marker-end="url(#a)"/>
<text x="355.0" y="680" text-anchor="middle" font-size="11" fill="#24292f">8. POST /api/laya/plan/  { text, context }</text>
<line x1="450" y1="726" x2="828" y2="726" stroke="#24292f" marker-end="url(#a)"/>
<text x="640.0" y="720" text-anchor="middle" font-size="11" fill="#24292f">9. what did the user mean?</text>
<line x1="830" y1="766" x2="452" y2="766" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="640.0" y="760" text-anchor="middle" font-size="11" fill="#24292f">{ reply, task, params }  checked by the same guard</text>
<line x1="450" y1="806" x2="262" y2="806" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="355.0" y="800" text-anchor="middle" font-size="11" fill="#24292f">reply + task  (buyPack, topUp, changeTariff, …)</text>
<rect x="10" y="842" width="117" height="22" fill="#fff" stroke="#24292f"/><text x="16" y="857" font-size="11" font-weight="700" fill="#24292f">Act and persist</text>
<line x1="260" y1="890" x2="448" y2="890" stroke="#24292f" marker-end="url(#a)"/>
<text x="355.0" y="884" text-anchor="middle" font-size="11" fill="#24292f">10. endpoint that sells it  +  Idempotency-Key</text>
<line x1="450" y1="930" x2="1008" y2="930" stroke="#24292f" marker-end="url(#a)"/>
<text x="730.0" y="924" text-anchor="middle" font-size="11" fill="#24292f">11. lock the wallet row, apply once</text>
<line x1="1010" y1="970" x2="452" y2="970" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="730.0" y="964" text-anchor="middle" font-size="11" fill="#24292f">new balance, transaction</text>
<rect x="780" y="998" width="220" height="40" fill="#fff" stroke="#24292f"/>
<text x="788" y="1012" font-size="11" fill="#24292f">One code path for every balance change:</text>
<text x="788" y="1026" font-size="11" fill="#24292f">row-locked, idempotent, cannot overdraw.</text>
<line x1="450" y1="1062" x2="262" y2="1062" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="355.0" y="1056" text-anchor="middle" font-size="11" fill="#24292f">12. result</text>
<line x1="260" y1="1102" x2="448" y2="1102" stroke="#24292f" marker-end="url(#a)"/>
<text x="355.0" y="1096" text-anchor="middle" font-size="11" fill="#24292f">13. POST /api/laya/done/  { task, ok }</text>
<line x1="450" y1="1142" x2="262" y2="1142" stroke="#24292f" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="355.0" y="1136" text-anchor="middle" font-size="11" fill="#24292f">one sentence about the outcome (never fails: fixed line if the model is down)</text>
</svg>