[project]
name = "white-collar-backend"
version = "0.1.0"
description = "Prototype backend for the white-collar mobile app"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.7",
    "django-modeltranslation>=0.19",
    "django-unfold>=0.50",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "celery>=5.4",
    "gunicorn>=23",
    "polib>=1.2",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["api/*/migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, comprehensions
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # line length is the formatter's job; long copy strings stay whole

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "postgres: needs PostgreSQL (set DATABASE_URL); proves locking under real concurrency",
    "redis: needs Redis (set REDIS_URL)",
]
